// Contrato gRPC das interações cliente-servidor do MPComm.
// A troca de mensagens entre peers continua em UDP e não aparece aqui.
syntax = "proto3";

package mpcomm;

message Empty {}

message Reply {
  string message = 1;
}

message PeerInfo {
  string host = 1;
  int32 udp_port = 2;
  int32 rpc_port = 3;
}

message PeerList {
  repeated PeerInfo peers = 1;
}

// n_messages == 0 pede que o peer encerre.
message PrepareRequest {
  int32 peer_id = 1;
  int32 n_messages = 2;
  int32 experiment_id = 3;
}

message LogEntry {
  int32 sender = 1;
  int32 number = 2;
}

message LogRequest {
  int32 peer_id = 1;
  int32 experiment_id = 2;
  repeated LogEntry entries = 3;
}

// Cadastro de peers. Clientes: peers e Comparison Server.
service GroupManager {
  rpc Register(PeerInfo) returns (Reply);
  rpc ListPeers(Empty) returns (PeerList);
  rpc Unregister(PeerInfo) returns (Reply);
  rpc Stop(Empty) returns (Reply);
}

// Controle do experimento em cada peer. Cliente: Comparison Server.
service Peer {
  rpc PrepareExperiment(PrepareRequest) returns (Reply);
  rpc StartExperiment(Empty) returns (Reply);
  rpc AbortExperiment(Empty) returns (Reply);
}

// Coleta dos logs. Clientes: peers.
service ComparisonServer {
  rpc SubmitLog(LogRequest) returns (Reply);
}
